<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC RAIDERS // DATABASE v1.17.0</title>
    <style>
        /* FONTS */
        @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-body: #050505;
            --bg-overlay: rgba(10, 10, 12, 0.85);
            --bg-panel: rgba(20, 22, 25, 0.7);
            --border-tech: rgba(255, 255, 255, 0.15);
            --arc-yellow: #ffc400;
            --arc-white: #e6e6e6;
            --arc-teal: #00e5ff;   
            --arc-red: #ff2a2a;
            --sb-inactive-bg: #2b2f3b;
            --sb-inactive-icon: #7f838d;
            --sb-active-bg: #f2e8d5;
            --sb-active-icon: #141619;
            --sb-icon-size: 52px;
            --sb-w: 70px;
            --font-head: 'Teko', sans-serif;
            --font-ui: 'Rajdhani', sans-serif;
            --font-body: 'Barlow', sans-serif;
            --header-h: 80px;
            --content-pad-left: 130px;
            
            /* Rarity */
            --col-common: #7a7a7a;
            --col-uncommon: #009e48;
            --col-rare: #0090d4;
            --col-epic: #a040b0;
            --col-legendary: #ff9600;
            
            /* Card Colors */
            --card-bg: #f2e8d5;
            --card-footer: #dcd0b9;
            --card-text: #121418;
        }

        @media (max-width: 1600px) {
            :root { --header-h: 65px; --sb-icon-size: 46px; --sb-w: 60px; --content-pad-left: 110px; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-body);
            background: radial-gradient(circle at 50% 30%, #1a1f2e 0%, #050505 80%);
            background-attachment: fixed;
            color: var(--arc-white);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        /* --- INTRO SCREEN --- */
        .intro-screen {
            position: fixed; inset: 0; z-index: 5000; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }
        body.db-loaded .intro-screen { opacity: 0; visibility: hidden; pointer-events: none; }
        .glitch-logo { width: 300px; margin-bottom: 40px; animation: glitch-skew 3s infinite; }
        .glitch-logo img { width: 100%; height: auto; }
        .btn-connect-big {
            background: rgba(0,0,0,0.6); color: var(--arc-yellow); border: 2px solid var(--arc-yellow);
            padding: 15px 40px; font-family: var(--font-head); font-size: 2rem; cursor: pointer; text-transform: uppercase;
        }

        /* --- LAYOUT --- */
        .layout-container { flex: 1; display: flex; flex-direction: column; padding-top: var(--header-h); position: relative; }
        header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000;
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
        .app-logo { height: 30px; cursor: pointer; }
        .app-logo img { height: 100%; }

        .nav-links { display: flex; gap: 10px; }
        .nav-item {
            font-family: var(--font-head); font-size: 1.4rem; color: #888; text-transform: uppercase;
            cursor: pointer; padding: 5px 15px; border-radius: 20px; transition: 0.2s;
        }
        .nav-item.active { color: #fff; background: rgba(255,255,255,0.1); border: 1px solid #fff; }

        /* --- CONTENT AREA --- */
        .content-area { flex: 1; overflow-y: auto; position: relative; }
        .stash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 30px; padding-left: var(--content-pad-left); }

        /* --- MAP SECTION --- */
        #map-view { 
            position: absolute; inset: 0; display: none; background: #000; 
            justify-content: center; align-items: center; overflow: hidden;
        }
        body.section-map #map-view { display: flex; }

        .map-viewport {
            position: relative;
            width: 90vh; /* Mantiene la proporzione basata sull'altezza */
            max-width: 95%;
            aspect-ratio: 1 / 1;
            background: #080808;
            border: 2px solid #222;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .map-img { width: 100%; height: 100%; object-fit: contain; opacity: 0.7; }
        
        /* Event Markers */
        .map-marker {
            position: absolute;
            width: 24px; height: 24px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .marker-icon {
            width: 14px; height: 14px; border-radius: 50%;
            background: #444; border: 2px solid #fff;
            transition: 0.3s;
        }
        .map-marker.active-minor .marker-icon { background: var(--arc-teal); box-shadow: 0 0 15px var(--arc-teal); animation: pulse-teal 2s infinite; }
        .map-marker.active-major .marker-icon { background: var(--arc-red); box-shadow: 0 0 15px var(--arc-red); animation: pulse-red 1.5s infinite; scale: 1.3; }
        
        @keyframes pulse-teal { 0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0, 229, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); } }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 42, 42, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0); } }

        .marker-label {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 2px 8px;
            font-size: 0.7rem; white-space: nowrap; margin-top: 5px;
            border-radius: 3px; font-weight: 700; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .map-hud {
            position: absolute; top: 20px; right: 20px; width: 300px;
            background: rgba(10, 12, 15, 0.9); border-left: 3px solid var(--arc-yellow);
            padding: 15px; backdrop-filter: blur(10px); z-index: 200;
        }
        .hud-title { font-family: var(--font-head); font-size: 1.8rem; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .event-card { background: rgba(255,255,255,0.03); padding: 8px; margin-bottom: 8px; border-radius: 4px; border-left: 3px solid #333; }
        .event-card.active { border-left-color: var(--arc-teal); background: rgba(0, 229, 255, 0.05); }
        .event-card.major { border-left-color: var(--arc-red); }

        /* --- SYSTEM BOXES --- */
        .btn-system {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: #ccc; padding: 5px 15px; font-family: var(--font-ui); cursor: pointer; text-transform: uppercase;
        }

        /* TOOLTIP */
        #tooltip { position: fixed; display: none; width: 320px; background: var(--card-bg); z-index: 2000; pointer-events: none; border-radius: 4px; overflow: hidden; color: #000;}
        .tt-header { display: flex; height: 26px; }
        .tt-tag { padding: 0 10px; font-family: var(--font-head); color: #fff; font-size: 1.1rem; display: flex; align-items: center; text-transform: uppercase; }
        .tt-body { padding: 15px; }
        .tt-title { font-family: var(--font-head); font-size: 2rem; line-height: 1; margin-bottom: 10px; text-transform: uppercase; }
        .tt-desc { font-family: var(--font-body); font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="introScreen" class="intro-screen">
    <div class="glitch-logo">
        <img src="https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/images/menu/logo.png" alt="ARC">
    </div>
    <button class="btn-connect-big" onclick="connectToDatabase()">CONNECT TO DATABASE</button>
</div>

<div class="layout-container">
    <header>
        <div class="header-left">
            <div class="app-logo" onclick="location.reload()">
                <img src="https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/images/menu/logo.png" alt="ARC">
            </div>
            <div class="nav-links">
                <div class="nav-item active" onclick="setSection('INVENTARIO')" data-nav="INVENTARIO">INVENTARIO</div>
                <div class="nav-item" onclick="setSection('MAPPA')" data-nav="MAPPA">MAPPA</div>
            </div>
        </div>
        <div class="header-right">
            <select id="langSelect" class="btn-system">
                <option value="it">ITA</option>
                <option value="en">ENG</option>
            </select>
        </div>
    </header>

    <div class="content-area">
        <div id="grid-view" class="stash-grid"></div>
        
        <div id="map-view">
            <div class="map-viewport" id="mapViewport">
                <img src="https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/images/maps/main.png" class="map-img">
                <div id="map-markers-container"></div>
            </div>
            <div class="map-hud">
                <div class="hud-title">LIVE TRACKER</div>
                <div id="event-list-hud"></div>
            </div>
        </div>
    </div>
</div>

<div id="tooltip"></div>

<script>
    let itemsDB = [], mapEventsDB = [];
    let currentLang = 'it', activeTranslation = {};
    let currentSection = 'INVENTARIO';
    let mapTicker = null;

    const GITHUB_BASE = 'https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/';

    async function connectToDatabase() {
        try {
            const ts = Date.now();
            // Carica lingua base
            await loadLanguage(currentLang);
            
            // Carica Items
            const itemsRes = await fetch(`https://api.github.com/repos/atarufox/Speranza-Archive/contents/items?t=${ts}`);
            const files = await itemsRes.json();
            const itemPromises = files.filter(f => f.name.endsWith('.json')).map(f => fetch(f.download_url).then(r => r.json()));
            itemsDB = await Promise.all(itemPromises);

            // Carica Eventi Mappa
            const mapRes = await fetch(`${GITHUB_BASE}map-events/map-events.json?t=${ts}`);
            if(mapRes.ok) {
                const mapData = await mapRes.json();
                mapEventsDB = Array.isArray(mapData) ? mapData : mapData.events;
            }

            document.body.classList.add('db-loaded');
            setSection('INVENTARIO');
        } catch (e) {
            console.error("Database Error:", e);
            alert("Errore connessione database.");
        }
    }

    async function loadLanguage(lang) {
        const res = await fetch(`${GITHUB_BASE}languages/${lang}.json`);
        if(res.ok) {
            activeTranslation = await res.json();
            currentLang = lang;
        }
    }

    function setSection(section) {
        currentSection = section;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.nav === section));
        
        if(section === 'MAPPA') {
            document.body.classList.add('section-map');
            startMapSystem();
        } else {
            document.body.classList.remove('section-map');
            stopMapSystem();
            renderGrid();
        }
    }

    // --- MAP SYSTEM ---
    function startMapSystem() {
        updateMapUI();
        mapTicker = setInterval(updateMapUI, 1000);
    }

    function stopMapSystem() {
        clearInterval(mapTicker);
    }

    function updateMapUI() {
        const hud = document.getElementById('event-list-hud');
        const markerContainer = document.getElementById('map-markers-container');
        const now = Math.floor(Date.now() / 1000);
        
        let hudHtml = "";
        markerContainer.innerHTML = ""; // Pulisce i marker per riposizionarli

        mapEventsDB.forEach(evt => {
            const interval = evt.interval || 3600;
            const duration = evt.duration || 600;
            const offset = evt.offset || 0;
            
            let cyclePos = (now - offset) % interval;
            if(cyclePos < 0) cyclePos += interval;

            const isActive = cyclePos < duration;
            const timeRem = isActive ? (duration - cyclePos) : (interval - cyclePos);
            const status = isActive ? (evt.type === 'major' ? 'MAJOR' : 'MINOR') : 'NONE';
            
            // Localizzazione Luogo
            const localizedLocation = getLoc(evt.location) || evt.location || "Unknown";

            // Marker sulla mappa
            if(evt.x !== undefined && evt.y !== undefined) {
                const marker = document.createElement('div');
                marker.className = `map-marker ${isActive ? 'active-' + (evt.type || 'minor') : ''}`;
                marker.style.left = `${evt.x}%`;
                marker.style.top = `${evt.y}%`;
                
                marker.innerHTML = `
                    <div class="marker-icon"></div>
                    <div class="marker-label">${localizedLocation}</div>
                `;
                
                marker.onmouseenter = (e) => showGenericTooltip(e, evt.name, `${localizedLocation}<br>Status: ${status}`);
                marker.onmouseleave = hideTooltip;
                
                markerContainer.appendChild(marker);
            }

            // Aggiunta al HUD laterale
            const m = Math.floor(timeRem / 60);
            const s = timeRem % 60;
            const timeStr = `${m}:${s.toString().padStart(2, '0')}`;

            hudHtml += `
                <div class="event-card ${isActive ? 'active' : ''} ${isActive && evt.type === 'major' ? 'major' : ''}">
                    <div style="font-weight:700; color:#fff">${evt.name}</div>
                    <div style="font-size:0.8rem; color:#aaa">${localizedLocation}</div>
                    <div style="color:var(--arc-yellow); font-family:var(--font-head); font-size:1.2rem">
                        ${isActive ? 'ENDING IN' : 'INCOMING'}: ${timeStr}
                    </div>
                </div>
            `;
        });

        hud.innerHTML = hudHtml;
    }

    // --- GRID SYSTEM ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = "";
        itemsDB.forEach(item => {
            const slot = document.createElement('div');
            slot.style.width = "100px";
            slot.style.height = "100px";
            slot.style.background = "rgba(255,255,255,0.05)";
            slot.style.border = "1px solid #333";
            slot.style.display = "flex";
            slot.style.alignItems = "center";
            slot.style.justifyContent = "center";
            slot.style.cursor = "pointer";

            const imgUrl = item.imageFilename ? GITHUB_BASE + item.imageFilename.replace(/^\//,'') : '';
            if(imgUrl) {
                slot.innerHTML = `<img src="${imgUrl}" style="max-width:80%; max-height:80%">`;
            } else {
                slot.innerHTML = `<span style="font-size:0.6rem; color:#555">${getLoc(item.name).substr(0,10)}</span>`;
            }

            slot.onmouseenter = (e) => showItemTooltip(e, item);
            slot.onmouseleave = hideTooltip;
            grid.appendChild(slot);
        });
    }

    // --- HELPERS ---
    function getLoc(obj) {
        if(!obj) return "";
        if(typeof obj === 'string') {
            // Cerca traduzione diretta se è una chiave stringa
            if(activeTranslation.locations && activeTranslation.locations[obj]) return activeTranslation.locations[obj];
            if(activeTranslation.ui && activeTranslation.ui[obj]) return activeTranslation.ui[obj];
            return obj;
        }
        return obj[currentLang] || obj['en'] || "";
    }

    function showItemTooltip(e, item) {
        const tt = document.getElementById('tooltip');
        const rarity = (item.rarity || 'common').toLowerCase();
        tt.innerHTML = `
            <div class="tt-header">
                <div class="tt-tag" style="background:var(--col-${rarity})">${rarity}</div>
            </div>
            <div class="tt-body">
                <div class="tt-title">${getLoc(item.name)}</div>
                <div class="tt-desc">${getLoc(item.description)}</div>
            </div>
        `;
        tt.style.display = 'block';
        moveTooltip(e);
    }

    function showGenericTooltip(e, title, desc) {
        const tt = document.getElementById('tooltip');
        tt.innerHTML = `
            <div class="tt-body">
                <div class="tt-title" style="font-size:1.4rem">${title}</div>
                <div class="tt-desc">${desc}</div>
            </div>
        `;
        tt.style.display = 'block';
        moveTooltip(e);
    }

    function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }
    
    function moveTooltip(e) {
        const tt = document.getElementById('tooltip');
        tt.style.left = (e.clientX + 15) + 'px';
        tt.style.top = (e.clientY + 15) + 'px';
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
        loadLanguage(e.target.value).then(() => {
            if(currentSection === 'MAPPA') updateMapUI(); else renderGrid();
        });
    });

</script>
</body>
</html>
