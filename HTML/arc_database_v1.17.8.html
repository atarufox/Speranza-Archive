<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC RAIDERS // DATABASE v1.17.8</title>
    <style>
        /* FONTS */
        @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@300;400;500;600;700&display=swap');

        :root {

            --bg-body: #050505;
            --bg-overlay: rgba(10, 10, 12, 0.85);
            --bg-panel: rgba(20, 22, 25, 0.7);
            --border-tech: rgba(255, 255, 255, 0.15);
            
            /* COLORS */
            --arc-yellow: #ffc400;
            --arc-white: #e6e6e6;
            --arc-teal: #00e5ff;   
            --arc-red: #ff2a2a;
            --arc-green: #00ff66;
            
            /* SIDEBAR DIMENSIONS */
            --sb-icon-size: 52px;
            --sb-gap: 8px;

            /* FONTS */
            --font-head: 'Teko', sans-serif;
            --font-ui: 'Rajdhani', sans-serif;

            /* DYNAMIC SIZES */
            --header-h: 80px;
            --logo-h: 30px;
            --nav-font: 1.5rem;
            --btn-play-h: 40px;
            --btn-sys-h: 34px;
            --search-w: 200px;
            --sb-w: 70px;
            --content-pad-left: 130px;
            
            /* RARITY */
            --col-common: #7a7a7a;
            --col-uncommon: #009e48;
            --col-rare: #0090d4;
            --col-epic: #a040b0;
            --col-legendary: #ff9600;
            --col-material: #0090d4;
            --col-recycle: #009e48;

            --card-bg: #f2e8d5;
            --card-footer: #dcd0b9;
            --card-text: #121418;
        }

        /* --- RESPONSIVE LOGIC --- */
        @media (max-width: 1600px) {
            :root { --header-h: 65px; --logo-h: 24px; --nav-font: 1.2rem; --btn-play-h: 34px; --btn-sys-h: 30px; --search-w: 160px; --sb-icon-size: 46px; --sb-gap: 6px; --sb-w: 60px; --content-pad-left: 110px; }
        }
        @media (max-width: 1300px) {
            :root { --header-h: 55px; --nav-font: 1.0rem; --btn-play-h: 30px; --btn-sys-h: 26px; --search-w: 130px; --sb-icon-size: 40px; --sb-gap: 4px; --sb-w: 50px; --content-pad-left: 90px; }
            .version-badge { display: none; }
        }

        /* GLOBAL RESET */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: radial-gradient(circle at 50% 30%, #1a1f2e 0%, #050505 80%);

            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- INTRO SCREEN --- */
        .intro-screen {
            position: fixed; inset: 0; z-index: 500;
            background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            overflow: hidden;
            animation: turn-on 2.5s linear forwards;
        }
        /* FIX: Ensure clicks pass through when hidden */
        body.db-loaded .intro-screen { opacity: 0; visibility: hidden; pointer-events: none; }

        .glitch-logo { width: 300px; margin-bottom: 40px; filter: drop-shadow(-2px 0 red) drop-shadow(2px 0 blue); animation: glitch-skew 3s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .glitch-logo img { width: 100%; height: auto; display: block; }
        .btn-connect-big { background: rgba(0,0,0,0.6); color: var(--arc-yellow); border: 2px solid var(--arc-yellow); padding: 15px 40px; font-family: var(--font-head); font-size: 2rem; letter-spacing: 3px; cursor: pointer; text-transform: uppercase; transition: 0.2s; position: relative; animation: text-flicker 4s infinite; }
        .btn-connect-big:hover { background: var(--arc-yellow); color: #000; transform: scale(1.02); }

        /* --- LOADING OVERLAY (FIXED Z-INDEX & POINTER EVENTS) --- */
        #loader {
            position: fixed; inset: 0; 
            display: none; /* JS toggles to flex */
            align-items: center; justify-content: center; flex-direction: column; 
            background: rgba(0,0,0,0.95); 
            z-index: 20000;
        }
        .loader-custom { width: 108px; height: 108px; display: block; animation: arcspin 2.2s linear infinite; }
        .spinner { border-color: #333; border-top-color: var(--arc-yellow); }

        /* --- LAYOUT --- */
        .layout-container { flex: 1; display: flex; flex-direction: column; padding-top: var(--header-h); }

        header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 100%);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 15px; height: 100%; }
        .app-logo img { height: var(--logo-h); width: auto; object-fit: contain; }
        .version-badge { font-family: var(--font-ui); font-size: 0.6rem; color: #555; font-weight: 700; margin-top: 2px; }

        .nav-links { display: flex; gap: 5px; opacity: 0; pointer-events: none; transition: 0.3s; }
        body.db-loaded .nav-links { opacity: 1; pointer-events: auto; }
        .nav-item { font-family: var(--font-head); font-weight: 600; font-size: var(--nav-font); color: #999; text-transform: uppercase; cursor: pointer; padding: 2px 10px; border: 2px solid transparent; border-radius: 50px; white-space: nowrap; }
        .nav-item:hover { color: #fff; }
        .nav-item.active { color: #fff; border-color: #f0ebd8; background: rgba(255,255,255,0.05); }

        .search-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0 25px 0 12px; color: #fff; width: var(--search-w); height: var(--btn-sys-h); border-radius: 4px; font-family: var(--font-ui); text-transform: uppercase; outline: none; font-size: 0.9rem; }
        .btn-system { height: var(--btn-sys-h); padding: 0 12px; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ccc; font-family: var(--font-ui); font-weight: 600; text-transform: uppercase; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; white-space: nowrap; }
        .btn-system:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }
        .btn-system.active { background: var(--arc-yellow); color: #000; border-color: var(--arc-yellow); }
        .btn-system.bp-filter-owned { background: var(--arc-teal); color: #000; border-color: var(--arc-teal); }
        .btn-system.bp-filter-missing { background: var(--arc-red); color: #000; border-color: var(--arc-red); }
        .btn-icon { width: var(--btn-sys-h); padding: 0; justify-content: center; }
        
        select option { background-color: #111; color: #fff; }
        #langSelect { background-color: rgba(255,255,255,0.05); color: #fff; }

        /* --- SIDEBAR --- */
        aside {
            position: absolute; top: calc(var(--header-h) + 20px); left: 30px; bottom: 20px; width: var(--sb-w);
            display: none; flex-direction: column; align-items: center; padding: 10px 0; gap: var(--sb-gap); z-index: 90;
            overflow-y: auto; scrollbar-width: none;
            animation: slideInLeft 0.3s ease;
        }
        body.db-loaded aside { display: flex; }
        body.section-progetti aside, body.section-map aside { display: none !important; }

        .filter-circle { width: var(--sb-icon-size); height: var(--sb-icon-size); border-radius: 50%; background-color: #2b2f3b; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; border: 2px solid transparent; flex-shrink: 0; }
        .filter-circle:hover { transform: scale(1.05); border-color: #555; }
        .filter-circle.active { background-color: #f2e8d5; border-color: #f2e8d5; box-shadow: 0 0 15px rgba(242, 232, 213, 0.2); }
        .filter-circle svg { width: 55%; height: 55%; fill: #7f838d; }
        .filter-circle.active svg { fill: #141619; }
        .filter-circle img { width: 100%; height: 100%; pointer-events: none; border-radius: 50%; }
        .filter-circle .icon-active { display: none; }
        .filter-circle.active .icon-active { display: block; }
        .filter-circle.active .icon-inactive { display: none; }
        .sidebar-sep { width: 30px; height: 1px; background: rgba(255,255,255,0.1); margin: 2px 0; flex-shrink: 0; }

        /* --- CONTENT AREA & GRID (FIXED INTERACTION) --- */
        .content-area { flex: 1; padding: 20px 40px 40px 40px; overflow-y: auto; transition: padding-left 0.3s ease; }
        body.db-loaded .content-area { padding-left: var(--content-pad-left); }
        body.section-progetti .content-area { padding-left: 0 !important; }
        body.section-map .content-area { padding: 0 !important; overflow: hidden; }

        .stash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding-bottom: 100px; }
        
        .slot {
            aspect-ratio: 1; background-color: rgba(15, 15, 15, 0.6);
            border: 1px solid var(--border-tech); border-radius: 2px;
            position: relative; display: flex; align-items: center; justify-content: center;
            transition: 0.1s; overflow: hidden; z-index: 5; /* Ensure base z-index is higher than BG */
        }
        .slot:hover { 
            border-color: #fff; background-color: rgba(40, 40, 45, 0.8); 
            box-shadow: 0 0 15px rgba(255,255,255,0.1); transform: scale(1.02); 
            z-index: 100; cursor: pointer; 
        }
        .slot img { max-width: 80%; max-height: 80%; object-fit: contain; pointer-events: none; }
        .slot::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; opacity:0.8; pointer-events:none; }
        .slot.common::after { background: var(--col-common); opacity: 0.3; }
        .slot.uncommon::after { background: var(--col-uncommon); }
        .slot.rare::after { background: var(--col-rare); }
        .slot.epic::after { background: var(--col-epic); }
        .slot.legendary::after { background: var(--col-legendary); }

        .bp-badge { position: absolute; inset:0; display: flex; justify-content: center; align-items: center; z-index: 10; font-weight: 900; font-family: var(--font-head); font-size: 2rem; pointer-events: none; background: rgba(0,0,0,0.7); }
        .bp-owned { color: var(--arc-teal); border: 2px solid var(--arc-teal); background: rgba(0, 229, 255, 0.1); }
        .bp-missing { color: var(--arc-red); border: 2px solid var(--arc-red); background: rgba(255, 42, 42, 0.1); }
        .slot.owned { border-color: var(--arc-teal); box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.2); }
        
        .slot-controls { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 24px; 
            display: none; flex-direction: row; background: rgba(0,0,0,0.9); z-index: 110; 
        }
        .slot:hover .slot-controls { display: flex; }
        .wl-btn { flex: 1; background: transparent; color: #aaa; border: none; cursor: pointer; font-size: 1.2rem; font-weight: 700; line-height: 24px; }
        .wl-btn:hover { color: #fff; background: rgba(255,255,255,0.2); }
        .wishlist-badge { position: absolute; top: 4px; right: 4px; background: var(--arc-yellow); color: #000; font-weight: 800; font-size: 0.8rem; padding: 2px 6px; border-radius: 2px; z-index: 20; pointer-events: none; }

        /* --- TOOLTIP & MODALS --- */
        #tooltip { position: fixed; display: none; width: 340px; background-color: var(--card-bg); color: var(--card-text); box-shadow: 0 40px 80px rgba(0,0,0,1); z-index: 15000; font-family: var(--font-body); pointer-events: none; border-radius: 4px; overflow: hidden; }
        #tooltip.interactive { pointer-events: auto !important; }
        #sidebar-tooltip { position: fixed; display: none; background: rgba(10, 10, 10, 0.95); color: var(--arc-yellow); border: 1px solid var(--arc-yellow); padding: 5px 12px; font-family: var(--font-ui); font-weight: 700; font-size: 0.9rem; z-index: 14000; pointer-events: none; }

        #modalBackdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); z-index: 16000; display: none; }
        .overlay-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; color: var(--arc-white); box-shadow: 0 0 100px rgba(0,0,0,1); z-index: 16100; width: 450px; display: none; flex-direction: column; max-height: 85vh; border: 1px solid var(--arc-yellow); }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #333; background: #1a1a1a; }
        .overlay-title { font-family: var(--font-head); font-size: 2.2rem; color: var(--arc-yellow); margin: 0; line-height: 1; text-transform: uppercase; }
        .overlay-close { background: none; border: none; color: #666; font-size: 2.5rem; cursor: pointer; line-height: 1; }
        .overlay-close:hover { color: #fff; }
        .overlay-scrollable-content { overflow-y: auto; flex: 1; background: #111; color: #fff; padding: 15px; }

        /* Card Styles */
        .tt-header { display: flex; height: 26px; }
        .tt-tag { padding: 0 10px; font-family: var(--font-head); font-weight: 600; font-size: 1.1rem; color: white; text-transform: uppercase; display: flex; align-items: center; gap: 5px; height: 100%; }
        .tt-body { padding: 16px 20px; }
        .tt-title { font-family: var(--font-head); font-weight: 700; font-size: 2.2rem; line-height: 0.9; margin-bottom: 12px; text-transform: uppercase; color: #000; }
        .tt-desc { font-size: 0.95rem; line-height: 1.35; color: #222; margin-bottom: 20px; font-weight: 500; }
        .tt-footer { background: var(--card-footer); display: flex; height: 50px; border-top: 1px solid #c9bea6; }
        .tt-foot-item { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-head); font-weight: 600; font-size: 1.3rem; border-right: 1px solid #c9bea6; color: #1a1a1a; }
        .tt-found { border-top: 1px solid #c0b49b; padding-top: 10px; margin-top: 10px; }
        .tt-found-label { font-size: 0.8rem; font-weight: 700; color: #555; text-transform: uppercase; }
        .tt-found-val { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.95rem; text-transform: uppercase; color: #000; }

        /* Info Tables */
        .info-section { background: #161616; border: 1px solid #2c2c2c; margin-bottom: 20px; padding: 15px; }
        .info-title { color: var(--arc-white); font-family: var(--font-head); font-size: 1.4rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .info-table td { padding: 8px 5px; border-bottom: 1px solid #222; color: #ccc; }
        .info-table img { width: 32px; height: 32px; object-fit: contain; vertical-align: middle; margin-right: 10px; background: rgba(255,255,255,0.05); }
        
        details.upgrade-level { margin-bottom: 10px; background: #111; border-left: 3px solid var(--arc-teal); }
        details.upgrade-level summary { padding: 10px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; list-style: none; display: flex; justify-content: space-between; }
        .btn-track { background: transparent; border: 1px solid #444; color: #888; padding: 2px 8px; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; font-family: var(--font-ui); font-weight: 700; transition: 0.2s; display: flex; align-items: center;}
        .btn-track:hover { border-color: var(--arc-yellow); color: var(--arc-yellow); }
        .btn-track.added { background: var(--arc-yellow); color: #000; border-color: var(--arc-yellow); }

        /* Admin Modal */
        #adminModal { width: 600px; }
        .edit-form { display: flex; flex-direction: column; gap: 10px; padding: 20px; color: #ddd; }
        .edit-row { display: flex; justify-content: space-between; align-items: center; }
        .edit-input { background: #000; border: 1px solid #444; color: white; padding: 8px; width: 65%; font-family: var(--font-ui); font-size: 1rem; }

        /* --- MAPPA DASHBOARD --- */
        #map-container { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; display:none; overflow: hidden; }
        #map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .map-bg { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0.5; }

        .mission-control { position: absolute; top: 20px; left: 20px; bottom: 20px; width: 400px; display: flex; flex-direction: column; gap: 15px; z-index: 200; pointer-events: none; }
        .mc-panel { background: rgba(15, 17, 20, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; backdrop-filter: blur(10px); padding: 15px; pointer-events: auto; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .mc-header { font-family: var(--font-head); font-size: 1.4rem; color: #fff; text-transform: uppercase; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 5px; }
        .mc-dot { width: 8px; height: 8px; border-radius: 50%; display: block; }
        .mc-dot.green { background: var(--arc-green); box-shadow: 0 0 8px var(--arc-green); }
        .mc-dot.blue { background: var(--arc-teal); }
        .mc-scroll-area { overflow-y: auto; max-height: calc(100vh - 250px); padding-right: 5px; }
        .mc-scroll-area::-webkit-scrollbar { width: 4px; }
        .mc-scroll-area::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        .mc-clock { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 5px 15px; border-radius: 20px; color: #666; font-size: 0.8rem; font-weight: 700; z-index: 200; pointer-events: none; }

        .ev-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-left: 3px solid #555; padding: 12px; margin-bottom: 8px; border-radius: 0 4px 4px 0; transition: 0.2s; }
        .ev-card:hover { background: rgba(255,255,255,0.07); transform: translateX(2px); }
        .ev-card.active { border-left-color: var(--arc-green); background: linear-gradient(90deg, rgba(0,255,102,0.05) 0%, rgba(0,0,0,0) 100%); }
        .ev-card.upcoming { border-left-color: var(--arc-teal); }
        .ev-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
        .ev-title { font-family: var(--font-head); font-size: 1.3rem; color: #fff; line-height: 1; text-transform: uppercase; }
        .ev-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; letter-spacing: 0.5px; }
        .ev-badge.active { background: rgba(0,255,102,0.2); color: var(--arc-green); border: 1px solid var(--arc-green); }
        .ev-badge.upcoming { background: rgba(0,229,255,0.2); color: var(--arc-teal); border: 1px solid var(--arc-teal); }
        .ev-loc { font-family: var(--font-ui); font-size: 0.9rem; color: #aaa; display: flex; align-items: center; gap: 5px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px;}
        .ev-loc svg { width: 14px; height: 14px; fill: #aaa; }
        .ev-meta { display: flex; justify-content: space-between; align-items: flex-end; font-family: var(--font-ui); font-size: 0.85rem; color: #888; }
        .ev-timer { font-family: var(--font-head); font-size: 1.4rem; color: #fff; line-height: 1; }
        .active .ev-timer { color: var(--arc-green); }
        
        /* Map Markers */
        .map-marker { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 100; cursor: pointer; transition: transform 0.2s; }
        .map-marker:hover { transform: translate(-50%, -50%) scale(1.1); z-index: 110; }
        .map-marker.status-active { background: var(--arc-green); box-shadow: 0 0 15px var(--arc-green); animation: pulse-green 2s infinite; }
        .map-marker.status-upcoming { background: var(--arc-teal); opacity: 0.6; }
        .map-marker.status-none { background: #333; border-color: #666; opacity: 0.5; width: 12px; height: 12px; }
        .marker-label { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; font-family: var(--font-head); font-size: 1rem; color: #fff; white-space: nowrap; text-align: center; line-height: 1; border: 1px solid rgba(255,255,255,0.2); pointer-events: none; z-index: 120; display: flex; flex-direction: column; gap: 2px; }
        .marker-label span { font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; }
        .status-active .marker-label { border-color: var(--arc-green); }
        .status-active .marker-label span { color: var(--arc-green); }
        .status-upcoming .marker-label { border-color: var(--arc-teal); }
        .status-upcoming .marker-label span { color: var(--arc-teal); }
        .status-none .marker-label { border-color: #555; background: rgba(0,0,0,0.6); }
        .status-none .marker-label span { color: #888; }

        @keyframes turn-on{0%{transform:scale(1,0.001) scaleY(0);filter:brightness(0);background:#000}10%{transform:scale(1,0.001) scaleY(1);filter:brightness(3);background:#fff}25%{transform:scale(1,0.001) scaleY(1);filter:brightness(1);background:#050505}40%{transform:scale(1,1)}}
        @keyframes pulse-green { 0% {box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7);} 70% {box-shadow: 0 0 0 10px rgba(0, 255, 102, 0);} 100% {box-shadow: 0 0 0 0 rgba(0, 255, 102, 0);} }
    </style>
</head>
<body>

<!-- INTRO / BOOT SCREEN -->

    <div class="intro-content">
        <div class="glitch-logo"><img src="https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/images/menu/logo.png" alt="ARC Raiders"></div>
        <button class="btn-connect-big" onclick="connectToDatabase()"><span id="btnConnectBig">UI_CONNECT_BTN</span></button>
    </div>
</div>

<div id="loader">
  <svg class="loader-custom" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="50" fill="black" /><circle cx="50" cy="50" r="48.5" stroke="white" stroke-width="3" fill="none" />
    <g stroke="white" stroke-width="3" fill="black" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="50" cy="50" r="11" />
      <defs><path id="reel-blade" d="M 45 29 L 39 9 A 42 42 0 0 1 61 9 L 55 29 A 25 25 0 0 1 45 29 Z" /></defs>
      <use href="#reel-blade" /><use href="#reel-blade" transform="rotate(120, 50, 50)" /><use href="#reel-blade" transform="rotate(240, 50, 50)" />
    </g>
  </svg>
    <div class="spinner"></div>
    <h2 style="margin-top:25px; font-family:var(--font-head); letter-spacing:2px; font-size: 1.5rem; color:#fff">LOADING</h2>
    <div id="loader-text" style="color:#666; font-family:var(--font-ui); margin-top:5px;"></div>

<div id="modalBackdrop" onclick="closeInfoModal()"></div>

<aside id="sidebarPanel"></aside>

<div class="layout-container">
    <header>
        <div class="header-left">
            <div class="logo-wrapper"><div class="app-logo"><img src="https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/images/menu/logo.png" alt="ARC"></div><span class="version-badge">v1.17.8</span></div>
            <div class="nav-links">
                <div class="nav-item active" onclick="setSection('INVENTARIO')" data-nav="INVENTARIO">NAV_INVENTARIO</div>
                <div class="nav-item" onclick="setSection('OFFICINA')" data-nav="OFFICINA">NAV_OFFICINA</div>
                <div class="nav-item" onclick="setSection('PROGETTI')" data-nav="PROGETTI">NAV_PROGETTI</div>
                <div class="nav-item" onclick="setSection('MAPPA')" data-nav="MAPPA">NAV_MAPPA</div>
                <div class="nav-item" onclick="setSection('MERCANTI')" data-nav="MERCANTI">NAV_MERCANTI</div>
                <div class="nav-item" onclick="setSection('NEGOZIO')" data-nav="NEGOZIO">NAV_NEGOZIO</div>
                <div class="nav-item" onclick="setSection('MISSIONI')" data-nav="MISSIONI">NAV_MISSIONI</div>
            </div>
        </div>
        <div class="header-right">
             <div class="search-container"><input type="text" class="search-box" id="searchInput" placeholder="SEARCH" disabled><span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span></div>
             <button class="btn-system" id="btnWishlist" onclick="handleTopRightButton()"><svg id="iconWishlist" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-1.99.9-1.99 2L3 20c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm0 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg><span id="btnWishlistText">WISHLIST</span> <span id="wlCounter" class="wl-counter" style="display:none">0</span></button>
            <select id="langSelect" class="btn-system lang-selector-btn" style="width: auto;"><option value="it">ITA</option><option value="en">ENG</option><option value="es">ESP</option><option value="fr">FRA</option></select>
            <button class="btn-system btn-icon" onclick="exportUserData()" title="BACKUP"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
            <label for="importInput" class="btn-system btn-icon" title="RESTORE"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg></label>
            <input type="file" id="importInput" style="display:none" onchange="importUserData(event)">
            <button class="btn-system btn-icon" id="btnAdmin" onclick="toggleAdminMode()" title="Admin"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 0.9-2 2v10c0 1.1 0.9 2 2 2h12c1.1 0 2-0.9 2-2V10c0-1.1-0.9-2-2-2zm-6 9c-1.1 0-2-0.9-2-2s0.9-2 2-2 2 0.9 2 2-0.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></button>
            <button class="btn-system" id="btnExport" onclick="exportOverrides()" style="display:none; color:var(--arc-yellow)">SAVE</button>
        </div>
    </header>

    <div class="content-area">
        <div id="grid-container" class="stash-grid"></div>
        <div id="map-container"></div>
    </div>
</div>

<div id="tooltip"></div>
<div id="infoModal" class="overlay-container"></div>
<div id="adminModal" class="overlay-container"></div>
<svg style="display:none"><symbol id="icon-wrench" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></symbol><symbol id="icon-arc" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2-1-2 1 2 1zm0 2l-10 5 10 5 10-5-10-5z"/></symbol><symbol id="icon-all" viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z M4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z M4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></symbol><symbol id="icon-cosmetic" viewBox="0 0 24 24"><path d="M12 2C9 2 7 3.5 7 5v2H5v14h14V7h-2V5c0-1.5-2-3-5-3zm0 2c1.5 0 3 1 3 3v2H9V5c0-2 1.5-3 3-3z"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol></svg>

<script>
    const MAP_COORDINATES = { "dam-battleground": { x: 75, y: 30 }, "buried-city": { x: 25, y: 70 }, "the-spaceport": { x: 80, y: 80 }, "blue-gate": { x: 45, y: 20 }, "stella-montis": { x: 20, y: 30 }, "default": { x: 50, y: 50 } };
    let itemsDB = [], hideoutDB = [], overridesDB = [], scheduleData = null;
    let wishlist = new Map(), ownedBlueprints = new Set();
    let currentFilter = 'ALL', viewMode = 'STASH', currentLang = 'it', adminMode = false, isEditing = false, isWishlistView = false, currentSection = 'INVENTARIO', bpViewMode = 0, isModalOpen = false, activeTranslation = {}, mapTicker = null, lastSignature = "";
    const GITHUB_RAW_BASE_URL = 'https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/';

    // --- ADMIN GLOBAL FUNCTIONS ---
    window.saveEdit = function(id) { if(!overridesDB[id]) overridesDB[id] = {}; if(!overridesDB[id].name) overridesDB[id].name = {}; if(!overridesDB[id].description) overridesDB[id].description = {}; overridesDB[id].name[currentLang] = document.getElementById('ed-name').value; overridesDB[id].description[currentLang] = document.getElementById('ed-desc').value; overridesDB[id].rarity = document.getElementById('ed-rarity').value; overridesDB[id].value = parseFloat(document.getElementById('ed-val').value); overridesDB[id].weightKg = parseFloat(document.getElementById('ed-w').value); overridesDB[id].stackSize = parseInt(document.getElementById('ed-stack').value); window.closeAdmin(); render(); };
    window.exportOverrides = function() { if(Object.keys(overridesDB).length === 0) { alert("No changes."); return; } const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(overridesDB, null, 2)); const anchor = document.createElement('a'); anchor.setAttribute("href", dataStr); anchor.setAttribute("download", "arc_overrides.json"); document.body.appendChild(anchor); anchor.click(); anchor.remove(); };
    window.closeAdmin = function() { isEditing = false; document.getElementById('tooltip').style.display = 'none'; document.getElementById('tooltip').classList.remove('interactive','admin-overlay'); isModalOpen = false; };
    window.openAdminEdit = function(data) { const tt = document.getElementById('tooltip'); tt.classList.add('interactive', 'admin-overlay'); tt.style.display = 'block'; tt.style.left='50%'; tt.style.top='50%'; tt.style.transform='translate(-50%,-50%)'; tt.innerHTML = `<div style="padding:25px; background:#111; color:#fff;"><h3 style="color:var(--arc-yellow); margin-bottom:20px; font-family:var(--font-head); font-size:2rem;">EDIT: ${data.id}</h3><div class="edit-form"><div class="edit-row"><span>Name (${currentLang}):</span> <input id="ed-name" class="edit-input" value="${getLoc(data.name).replace(/"/g, '&quot;')}"></div><div class="edit-row"><span>Desc:</span> <textarea id="ed-desc" class="edit-input">${getLoc(data.description)}</textarea></div><div class="edit-row"><span>Rarity:</span> <select id="ed-rarity" class="edit-input"><option value="Common" ${data.rarity=='Common'?'selected':''}>Common</option><option value="Uncommon" ${data.rarity=='Uncommon'?'selected':''}>Uncommon</option><option value="Rare" ${data.rarity=='Rare'?'selected':''}>Rare</option><option value="Epic" ${data.rarity=='Epic'?'selected':''}>Epic</option><option value="Legendary" ${data.rarity=='Legendary'?'selected':''}>Legendary</option></select></div><div class="edit-row"><span>Value:</span> <input id="ed-val" type="number" class="edit-input" value="${data.value || 0}"></div><div class="edit-row"><span>Weight:</span> <input id="ed-w" type="number" step="0.1" class="edit-input" value="${data.weightKg || 0}"></div><div class="edit-row"><span>Stack:</span> <input id="ed-stack" type="number" class="edit-input" value="${data.stackSize || 1}"></div><div style="display:flex; gap:10px; margin-top:15px;"><button onclick="saveEdit('${data.id}')" style="background:var(--arc-yellow); border:none; padding:10px 20px; font-family:var(--font-head); font-size:1.2rem; cursor:pointer;">SAVE</button><button onclick="window.closeAdmin()" style="background:#333; border:none; padding:10px 20px; font-family:var(--font-head); font-size:1.2rem; cursor:pointer; color:white;">CANCEL</button></div></div></div>`; isModalOpen = true; };
    window.toggleAdminMode = function() { adminMode = !adminMode; document.getElementById('btnAdmin').classList.toggle('active'); document.getElementById('btnExport').style.display = adminMode ? 'flex' : 'none'; if(!adminMode) window.closeAdmin(); };

    // --- MAIN ---
    async function initApp() { dom.langSelect.value = 'it'; await loadLanguage('it'); }
    async function loadLanguage(lang) {
        document.getElementById('loader').style.display='flex';
        try { const r = await fetch(`${GITHUB_RAW_BASE_URL}languages/${lang}.json?t=${Date.now()}`); activeTranslation = await r.json(); currentLang = lang; updateStaticText(); if(document.body.classList.contains('db-loaded')) { renderSidebar(); updateUI(); render(); } } catch(e) { console.error(e); }
        document.getElementById('loader').style.display='none';
    }
    async function connectToDatabase() {
        document.getElementById('loader').style.display='flex';
        try {
            const listUrl = `https://api.github.com/repos/atarufox/Speranza-Archive/contents/items?t=${Date.now()}`;
            const rList = await fetch(listUrl); const files = await rList.json();
            itemsDB = await Promise.all(files.filter(f=>f.name.endsWith('.json')).map(f=>fetch(f.download_url).then(r=>r.json())));
            
            const hFiles = ['explosives_station.json', 'gear_bench.json', 'gunsmith.json', 'medical_lab.json', 'refiner.json', 'scrappy.json', 'stash.json', 'utility_station.json', 'workbench.json'];
            const hRaw = await Promise.all(hFiles.map(f=>fetch(`${GITHUB_RAW_BASE_URL}hideout/${f}`).then(r=>r.ok?r.json():null)));
            hideoutDB = normalizeHideoutData(hRaw.filter(Boolean));

            const mMap = await fetch(`${GITHUB_RAW_BASE_URL}map-events/map-events.json?t=${Date.now()}`);
            if(mMap.ok) scheduleData = await mMap.json();

            enableUI();
        } catch(e) { alert("Connection Error"); console.error(e); document.getElementById('loader').style.display='none'; }
    }
    function enableUI() { document.body.classList.add('db-loaded'); dom.search.disabled=false; document.getElementById('loader').style.display='none'; setSection('INVENTARIO'); setFilter('ALL'); }

    // --- HELPERS ---
    const dom = { grid: document.getElementById('grid-container'), search: document.getElementById('searchInput'), searchClear: document.getElementById('searchClear'), tt: document.getElementById('tooltip'), sidebar: document.getElementById('sidebarPanel'), sbTooltip: document.getElementById('sidebar-tooltip'), wlCounter: document.getElementById('wlCounter'), infoModal: document.getElementById('infoModal'), modalBackdrop: document.getElementById('modalBackdrop'), btnWishlistText: document.getElementById('btnWishlistText'), btnWishlist: document.getElementById('btnWishlist'), langSelect: document.getElementById('langSelect') };
    dom.search.addEventListener('input', (e)=>{ dom.searchClear.style.display = e.target.value?'block':'none'; render(); });
    dom.langSelect.addEventListener('change', (e)=>{ if(e.target.value) loadLanguage(e.target.value); });
    function getUI(k){ return activeTranslation?.ui?.[k] || `UI_${k.toUpperCase()}`; }
    function getNav(k){ return activeTranslation?.nav?.[k] || `NAV_${k}`; }
    function getFilter(k){ return activeTranslation?.filters?.[k] || `FILT_${k}`; }
    function getLoc(o){ if(!o) return ""; if(typeof o==='string') return o; return o[currentLang]||o['en']||""; }
    function getLocLocation(id){ return activeTranslation?.locations?.[id] || id; }
    function updateStaticText() { dom.search.placeholder = getUI('search'); if(dom.btnWishlistText && !isWishlistView && currentSection!=='PROGETTI') dom.btnWishlistText.innerText = getUI('what_i_need'); document.querySelectorAll('.nav-item').forEach(el => { el.innerText = getNav(el.getAttribute('data-nav')); }); }
    window.closeInfoModal = function() { dom.infoModal.style.display='none'; dom.modalBackdrop.style.display='none'; isModalOpen=false; };
    function setSection(s) { currentSection=s; document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.getAttribute('data-nav')===s)); if(s==='MAPPA'){ document.body.classList.add('section-map'); document.getElementById('map-container').style.display='block'; dom.grid.style.display='none'; renderMap(); } else { document.body.classList.remove('section-map'); document.getElementById('map-container').style.display='none'; dom.grid.style.display='grid'; stopMapTicker(); } if(s==='PROGETTI'){ document.body.classList.add('section-progetti'); } else { document.body.classList.remove('section-progetti'); } renderSidebar(); if(document.body.classList.contains('db-loaded') && s!=='MAPPA'){ currentFilter='ALL'; viewMode='STASH'; isWishlistView=false; dom.btnWishlist.classList.remove('active'); updateUI(); render(); } }
    function renderSidebar() { const cfg = SIDEBAR_CONFIG[currentSection]||[]; dom.sidebar.innerHTML=""; cfg.forEach(item=>{ if(item.sep){ dom.sidebar.appendChild(Object.assign(document.createElement('div'),{className:'sidebar-sep'})); return; } let disp=""; if(currentSection==='OFFICINA' && item.targetId){ const r=hideoutDB.find(x=>x.id===item.targetId); disp=r?getLoc(r.name):item.targetId; } else { disp=getFilter(item.labelKey); } const div=document.createElement('div'); div.className='filter-circle'; div.onmouseenter=(e)=>showSidebarTooltip(e,disp); div.onmouseleave=()=>dom.sbTooltip.style.display='none'; if((currentSection==='OFFICINA' && (item.targetId===currentFilter || (item.id==='ALL' && currentFilter==='ALL'))) || item.id===currentFilter) div.classList.add('active'); div.onclick=()=>setFilter(item.targetId||item.id); if(item.type==='svg') div.innerHTML=`<svg><use href="#${item.icon}"></use></svg>`; else { div.classList.add('has-image'); let img = (currentSection==='OFFICINA' && item.targetId)?item.targetId:item.img; div.innerHTML=`<img class="icon-inactive" src="${GITHUB_RAW_BASE_URL}images/menu/${img}_inactive.png" onerror="this.style.display='none'"><img class="icon-active" src="${GITHUB_RAW_BASE_URL}images/menu/${img}_active.png" onerror="this.style.display='none'">`; } dom.sidebar.appendChild(div); }); }
    function showSidebarTooltip(e,t){ if(!t)return; const r=e.currentTarget.getBoundingClientRect(); dom.sbTooltip.innerText=t; dom.sbTooltip.style.display='block'; dom.sbTooltip.style.left=(r.right+10)+'px'; dom.sbTooltip.style.top=(r.top+(r.height/2)-(dom.sbTooltip.offsetHeight/2))+'px'; }
    function setFilter(f){ currentFilter=f; renderSidebar(); render(); }
    function handleTopRightButton(){ if(currentSection==='PROGETTI'){ bpViewMode=(bpViewMode+1)%3; updateUI(); render(); } else toggleWishlistView(); }
    function toggleWishlistView(){ isWishlistView=!isWishlistView; if(isWishlistView){ dom.btnWishlist.classList.add('active'); viewMode='WISHLIST'; } else { dom.btnWishlist.classList.remove('active'); setFilter('ALL'); } render(); }
    function updateUI(){ if(currentSection==='PROGETTI'){ dom.btnWishlist.classList.remove('active','bp-filter-owned','bp-filter-missing'); document.getElementById('iconWishlist').style.display='none'; dom.wlCounter.style.display='none'; if(bpViewMode===0) dom.btnWishlistText.innerText=getUI('all'); else if(bpViewMode===1){ dom.btnWishlistText.innerText=getUI('have'); dom.btnWishlist.classList.add('bp-filter-owned'); } else { dom.btnWishlistText.innerText=getUI('missing'); dom.btnWishlist.classList.add('bp-filter-missing'); } } else { document.getElementById('iconWishlist').style.display='block'; dom.btnWishlistText.innerText=getUI('what_i_need'); dom.btnWishlist.classList.remove('bp-filter-owned','bp-filter-missing'); updateWishlistCounter(); } }
    function updateWishlistCounter(){ let c=0; wishlist.forEach(v=>c+=(parseInt(v)||0)); dom.wlCounter.innerText=c; dom.wlCounter.style.display=c>0?'inline-block':'none'; }
    function normalizeHideoutData(src){ let norm=[]; src.forEach(d=>{ if(d&&d.id) norm.push({id:d.id, name:d.name, levels:(d.levels||[]).map(l=>({level:l.level, requirements:(l.requirementItemIds||l.requirements||[]).map(r=>({item:r.itemId||r.item, count:r.quantity||r.count}))}))}); }); return norm; }
    function getItem(id){ let b=itemsDB.find(x=>x.id===id)||hideoutDB.find(x=>x.id===id); if(!b)return null; if(overridesDB[id]){ let m={...b,...overridesDB[id]}; if(overridesDB[id].name) m.name={...(b.name||{}),...overridesDB[id].name}; if(overridesDB[id].description) m.description={...(b.description||{}),...overridesDB[id].description}; return m; } return b; }
    function normalizeReqs(r){ if(!r)return[]; if(Array.isArray(r)) return r.map(x=> (x.itemId&&x.quantity!==undefined)?{item:x.itemId, count:x.quantity}:x); return Object.entries(r).map(([k,v])=>({item:k, count:v})); }
    function getImg(d){ if(!d?.imageFilename)return null; if(d.imageFilename.startsWith('http')) return d.imageFilename; return GITHUB_RAW_BASE_URL+d.imageFilename.replace(/^[\/|\\]/,''); }
    function clearSearch(){ dom.search.value=""; dom.searchClear.style.display='none'; render(); }
    function toggleBlueprint(id,e){ e.stopPropagation(); if(ownedBlueprints.has(id)) ownedBlueprints.delete(id); else ownedBlueprints.add(id); localStorage.setItem('arc_blueprints', JSON.stringify(Array.from(ownedBlueprints))); updateUI(); render(); }
    window.modWishlist = function(id, d, e){ e.stopPropagation(); let c=parseInt(wishlist.get(id)||0)+d; if(c<=0) wishlist.delete(id); else wishlist.set(id, c); localStorage.setItem('arc_wishlist', JSON.stringify(Array.from(wishlist.entries()))); if(isWishlistView) render(); else { let slot=e.target.closest('.slot'); let badge=slot.querySelector('.wishlist-badge'); if(c>0){ if(!badge){ badge=document.createElement('div'); badge.className='wishlist-badge'; slot.appendChild(badge); } badge.innerText=c; } else if(badge) badge.remove(); } updateWishlistCounter(); };
    window.addReqsToWishlist = function(j,b){ try{ JSON.parse(decodeURIComponent(j)).forEach(r=>{ wishlist.set(r.item, (wishlist.get(r.item)||0)+r.count); }); localStorage.setItem('arc_wishlist', JSON.stringify(Array.from(wishlist.entries()))); b.classList.add('added'); b.innerText=getUI('added'); updateWishlistCounter(); }catch(e){} };

    // --- RENDER LOGIC ---
    function render(){
        dom.grid.innerHTML=""; const search=dom.search.value.toLowerCase(); let src=[];
        if(itemsDB.length===0 && hideoutDB.length===0 && !isWishlistView && wishlist.size===0) return;
        if(currentSection!=='INVENTARIO' && currentSection!=='PROGETTI' && currentSection!=='OFFICINA' && !isWishlistView){ dom.grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;margin-top:100px;color:#666"><h3 style="font-family:var(--font-head);font-size:3rem;color:#aaa">SEZIONE ${currentSection}</h3><p style="color:var(--arc-yellow)">WORK IN PROGRESS</p></div>`; return; }
        if(isWishlistView){ wishlist.forEach((q,id)=>{ const i=getItem(id); if(i) src.push({...i,_wishQty:q}); }); if(src.length===0) dom.grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;margin-top:100px;color:#444"><h3 style="font-family:var(--font-head);font-size:2rem;color:#aaa">WISHLIST VUOTA</h3></div>`; else { let tw=0,tv=0; src.forEach(i=>{ tw+=(i.weightKg||0)*i._wishQty; tv+=(i.value||0)*i._wishQty; }); dom.grid.innerHTML=`<div style="grid-column:1/-1;color:#aaa;font-family:var(--font-head);font-size:1.5rem;margin-bottom:10px;">WISHLIST: <span style="color:#fff">${src.length}</span> ITEMS | WEIGHT: <span style="color:#fff">${tw.toFixed(1)}</span>KG | VALUE: <span style="color:var(--arc-yellow)">${tv}</span></div>`; } }
        else if(currentSection==='OFFICINA'){ src=hideoutDB.filter(x=>{ if(search && !(getLoc(x.name)||x.id).toLowerCase().includes(search)) return false; if(x.id==='stash')return false; return currentFilter==='ALL'||currentFilter===x.id; }); }
        else { src=itemsDB.map(x=>getItem(x.id)).filter(i=>{ if(!i)return false; if(search && !(getLoc(i.name)||i.id).toLowerCase().includes(search)) return false; const t=(i.type||"").toLowerCase(); const isBP=(t.includes('blueprint')||t.includes('schematic')||(i.name&&JSON.stringify(i.name).toLowerCase().includes('blueprint'))); const isCosm=(t.includes('cosmetic')||t.includes('outfit')||t.includes('backpack')||t.includes('customization')); if(currentSection==='PROGETTI'){ if(!isBP) return false; if(bpViewMode===1 && !ownedBlueprints.has(i.id)) return false; if(bpViewMode===2 && ownedBlueprints.has(i.id)) return false; if(currentFilter==='ALL') return true; if(currentFilter==='ARMI') return t.includes('weapon'); if(currentFilter==='MOD') return t.includes('modification')||t.includes('gadget'); if(currentFilter==='MATERIALI') return t.includes('material'); return false; } if(currentFilter==='ALL') return (!isBP && !isCosm); if(currentFilter==='COSMETICS') return isCosm; if(currentFilter==='POTENZIAMENTI') return t.includes('augment'); if(currentFilter==='SCUDI') return t.includes('shield'); if(currentFilter==='ARMI') return (t.includes('assault rifle')||t.includes('hand cannon')||t.includes('smg')||t.includes('pistol')||t.includes('lmg')||t.includes('battle rifle')||t.includes('shotgun')||t.includes('sniper')||t.includes('special')||t.includes('launcher')||t.includes('melee')); if(currentFilter==='MUNIZIONI') return t.includes('ammunition'); if(currentFilter==='MOD') return t.includes('modification')||t.includes('gadget'); if(currentFilter==='USO_RAPIDO') return t.includes('quick use'); if(currentFilter==='CHIAVI') return t.includes('key'); if(currentFilter==='MATERIALI') return t.includes('material')||t.includes('recyclable')||t.includes('nature')||t.includes('refined')||t.includes('topside'); if(currentFilter==='VARIE') return t.includes('trinket')||t.includes('misc')||t.includes('junk')||t.includes('valuable'); return false; }); }
        if(currentSection==='PROGETTI'){ const vis=src.length; const own=src.filter(i=>ownedBlueprints.has(i.id)).length; dom.grid.innerHTML+=`<div class="section-header-bp" style="grid-column:1/-1"><div class="sh-title">PROGETTI</div><div class="sh-subtitle">TROVATO: <span style="color:var(--arc-white)">${own}</span> / <span style="color:#666">${vis}</span></div></div>`; }
        src.forEach(data=>{ const isBP = (data.type||"").toLowerCase().includes('blueprint'); const isItem = !isBP && (currentSection!=='OFFICINA' || isWishlistView); const r=(data.rarity||'common').toLowerCase(); let img=(currentSection==='OFFICINA'&&!isWishlistView)?`${GITHUB_RAW_BASE_URL}images/menu/${data.id.toLowerCase()}.png`:getImg(data); const slot=document.createElement('div'); slot.className=`slot ${r}`; if(currentSection==='PROGETTI'){ if(ownedBlueprints.has(data.id)){ slot.classList.add('owned'); slot.innerHTML+=`<div class="bp-badge bp-owned">V</div>`; } else slot.classList.add('is-missing'); } if(adminMode&&overridesDB[data.id]) slot.style.borderTop="2px solid var(--arc-yellow)"; let inn=img?`<img src="${img}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:""; inn+=`<div class="slot-fallback-container" style="${img?'display:none;':''}flex-direction:column;align-items:center;text-align:center;width:100%;height:100%;justify-content:center;"><svg class="slot-fallback" viewBox="0 0 24 24"><path d="M12 2l-10 6 10 6 10-6-10-6zm0 14l-10-6v8l10 6 10-6v-8l-10 6z"/></svg><div class="fallback-text">${getLoc(data.name).substr(0,10)}</div></div>`; slot.innerHTML+=inn;
        if(isItem && currentSection!=='PROGETTI'){ slot.innerHTML+=`<div class="slot-controls"><button class="wl-btn plus" onclick="modWishlist('${data.id}',1,event)">+</button><button class="wl-btn minus" onclick="modWishlist('${data.id}',-1,event)">-</button></div>`; if(wishlist.has(data.id)&&!isWishlistView) slot.innerHTML+=`<div class="wishlist-badge">${wishlist.get(data.id)}</div>`; if(isWishlistView) slot.innerHTML+=`<div style="position:absolute;top:2px;right:2px;color:var(--arc-yellow);font-weight:bold;font-size:0.8rem">x${data._wishQty}</div>`; }
        slot.onmouseenter=(e)=>{ if(!isEditing&&!isModalOpen) showTooltip(data,e); }; slot.onmouseleave=()=>hideTooltip(); slot.onmousemove=(e)=>moveTooltip(e); slot.onclick=(e)=>{ if(adminMode) openAdminEdit(data); else if(currentSection==='PROGETTI'||isBP) toggleBlueprint(data.id,e); else openInfoModal(data); }; dom.grid.appendChild(slot); });
    }

    // --- MAP & SCHEDULE ---
    function renderMap(){ document.getElementById('map-container').innerHTML=''; const w=document.createElement('div'); w.id='map-wrapper'; const img=document.createElement('img'); img.src=`${GITHUB_RAW_BASE_URL}images/maps/main.png`; img.className='map-bg'; w.appendChild(img); const db=document.createElement('div'); db.className='mission-control'; db.id='missionControl'; const clk=document.createElement('div'); clk.className='mc-clock'; clk.id='mcClock'; document.getElementById('map-container').append(w,db,clk); startMapTicker(); }
    function startMapTicker(){ if(mapTicker) clearInterval(mapTicker); lastSignature=""; updateMapEvents(); mapTicker=setInterval(updateMapEvents,1000); }
    function stopMapTicker(){ if(mapTicker) clearInterval(mapTicker); }
    function updateMapEvents(){
        if(!scheduleData){ document.getElementById('missionControl').innerHTML=`<div style="color:#fff;padding:20px;">NO SCHEDULE DATA</div>`; return; }
        const now=new Date(), nowTs=now.getTime(); const utc=now.toISOString().substring(11,16); const loc=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); const clk=document.getElementById('mcClock'); if(clk) clk.innerHTML=`UTC: ${utc} | LOCAL: ${loc}`;
        const wrap=document.getElementById('map-wrapper'); const dash=document.getElementById('missionControl'); const sc=dash.querySelector('.mc-scroll-area'); let st=sc?sc.scrollTop:0;
        
        let acts=[], upcs=[], handled=new Set();
        if(scheduleData.schedule){
            const T=scheduleData.eventTypes||{}, S=scheduleData.schedule;
            Object.keys(S).forEach(mid=>{ Object.keys(S[mid]).forEach(cat=>{ Object.entries(S[mid][cat]).forEach(([h,tid])=>{
                const def=T[tid]; if(!def)return; const dur=(def.duration||60)*60000; const th=parseInt(h);
                [0,1].forEach(d=>{
                    const s=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+d,th,0,0)); const e=new Date(s.getTime()+dur);
                    if(nowTs>=s.getTime() && nowTs<e.getTime()){ acts.push({mid:mid, tid:tid, name:def.name||tid, cat:cat, left:Math.floor((e.getTime()-nowTs)/1000)}); handled.add(mid); }
                    else if(nowTs<s.getTime() && (s.getTime()-nowTs)<43200000){ upcs.push({mid:mid, tid:tid, name:def.name||tid, cat:cat, left:Math.floor((s.getTime()-nowTs)/1000)}); }
                });
            })})});
        }
        upcs.sort((a,b)=>a.left-b.left);
        const sig = acts.map(e=>e.mid+e.tid).join('-')+'|'+upcs.map(e=>e.mid+e.tid).join('-');
        
        if(sig===lastSignature){
            acts.forEach(e=>{ let el=document.getElementById(`t-act-${e.mid}-${e.tid}`); if(el) el.innerText=`${Math.floor(e.left/60)}m ${e.left%60}s`; });
            upcs.forEach(e=>{ let el=document.getElementById(`t-upc-${e.mid}-${e.tid}`); if(el) { let h=Math.floor(e.left/3600), m=Math.floor((e.left%3600)/60), s=e.left%60; el.innerText=(h>0?`${h}h `:"")+`${m}m ${s}s`; } });
        } else {
            lastSignature=sig; wrap.querySelectorAll('.map-marker').forEach(e=>e.remove());
            let h='';
            if(acts.length>0){
                h+=`<div class="mc-panel"><div class="mc-header"><span class="mc-dot green"></span> ACTIVE</div><div class="mc-scroll-area">`;
                acts.forEach(e=>{
                    h+=`<div class="ev-card active"><div class="ev-top"><div class="ev-title">${getLocLocation(e.name)}</div><div class="ev-badge active">ACTIVE</div></div><div class="ev-loc"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> ${getLocLocation(e.mid)}</div><div class="ev-meta"><div><span class="ev-label">ENDS</span><span class="ev-timer" id="t-act-${e.mid}-${e.tid}">${Math.floor(e.left/60)}m ${e.left%60}s</span></div></div></div>`;
                    let c=MAP_COORDINATES[e.mid]||MAP_COORDINATES['default']; const m=document.createElement('div'); m.className='map-marker status-active'; m.style.left=c.x+'%'; m.style.top=c.y+'%'; m.innerHTML=`<div class="marker-label"><span>ACTIVE</span>${getLocLocation(e.name)}</div>`; wrap.appendChild(m);
                }); h+=`</div></div>`;
            }
            h+=`<div class="mc-panel" style="flex:1;overflow:hidden;"><div class="mc-header"><span class="mc-dot blue"></span> UPCOMING</div><div class="mc-scroll-area" id="mcScrollUp">`;
            upcs.forEach(e=>{
                let hh=Math.floor(e.left/3600), mm=Math.floor((e.left%3600)/60), ss=e.left%60;
                h+=`<div class="ev-card upcoming"><div class="ev-top"><div class="ev-title">${getLocLocation(e.name)}</div><div class="ev-badge upcoming">SOON</div></div><div class="ev-loc"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> ${getLocLocation(e.mid)}</div><div class="ev-meta"><div><span class="ev-label">STARTS</span><span class="ev-timer" id="t-upc-${e.mid}-${e.tid}">${hh>0?hh+'h ':''}${mm}m ${ss}s</span></div></div></div>`;
                if(!acts.find(a=>a.mid===e.mid) && !handled.has(e.mid) && e.left<7200){
                    handled.add(e.mid); let c=MAP_COORDINATES[e.mid]||MAP_COORDINATES['default']; const m=document.createElement('div'); m.className='map-marker status-upcoming'; m.style.left=c.x+'%'; m.style.top=c.y+'%'; m.innerHTML=`<div class="marker-label"><span>SOON</span>${getLocLocation(e.name)}</div>`; wrap.appendChild(m);
                }
            }); h+=`</div></div>`;
            dash.innerHTML=h;
            Object.keys(MAP_COORDINATES).forEach(k=>{ if(k!=='default' && !handled.has(k)){ let c=MAP_COORDINATES[k]; const m=document.createElement('div'); m.className='map-marker status-none'; m.style.left=c.x+'%'; m.style.top=c.y+'%'; m.innerHTML=`<div class="marker-label"><span>NO EVENT</span>${getLocLocation(k)}</div>`; wrap.appendChild(m); } });
        }
        const newSc=document.getElementById('mcScrollUp'); if(newSc) newSc.scrollTop=st;
    }

    // --- TOOLTIP / MODAL LOGIC ---
    function showTooltip(d,e){ dom.tt.innerHTML=`<div style="background:var(--card-bg);color:var(--card-text);"><div class="tt-header"><div class="tt-tag" style="background:var(--col-${(d.rarity||'common').toLowerCase()})">${(d.rarity||'common').toUpperCase()}</div></div><div class="tt-body"><div class="tt-title">${getLoc(d.name)}</div><div class="tt-desc">${getLoc(d.description)}</div>${d.foundIn?`<div class="tt-found"><div class="tt-found-label">SOURCE:</div><div class="tt-found-val"><svg><use href="#icon-arc"></use></svg> ${getLoc(d.foundIn)}</div></div>`:''}</div><div class="tt-footer"><div class="tt-foot-item"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" fill="#1a1a1a"></path></svg> ${d.stackSize||1}</div><div class="tt-foot-item"><img src="${GITHUB_RAW_BASE_URL}images/menu/weight.png" style="height:22px;"> ${(d.weightKg||0).toString().replace('.',',')}</div><div class="tt-foot-item"><img src="${GITHUB_RAW_BASE_URL}images/menu/coins.png" style="height:22px;"> ${(d.value||0).toLocaleString()}</div></div></div>`; dom.tt.style.display='block'; moveTooltip(e); }
    function hideTooltip(){ dom.tt.style.display='none'; }
    function moveTooltip(e){ let l=e.clientX+20, t=e.clientY+20; if(l+370>window.innerWidth) l=e.clientX-380; if(t+dom.tt.offsetHeight>window.innerHeight) t=e.clientY-dom.tt.offsetHeight; dom.tt.style.left=l+'px'; dom.tt.style.top=t+'px'; }
    function openInfoModal(d){
        if(!d)return; hideTooltip(); isModalOpen=true;
        let cHtml='', uHtml='', usHtml='';
        const reqs=normalizeReqs(d.recipe);
        if(reqs.length>0||d.craftBench){
            cHtml+=`<div class="info-section"><div class="info-title">${getUI('crafting')}</div>`;
            if(d.craftBench) cHtml+=`<div style="margin-bottom:10px;color:#aaa;font-size:0.9rem;"><span style="color:#fff;font-weight:700;">${getUI('bench')}:</span> ${String(d.craftBench).toUpperCase().replace(/_/g,' ')}</div>`;
            if(reqs.length>0){ cHtml+=`<table class="info-table"><tbody>`+reqs.map(r=>{ const i=getItem(r.item); return `<tr><td style="display:flex;align-items:center">${i?`<img src="${getImg(i)}" class="mini-icon" onerror="this.style.display='none'">`:''}${i?getLoc(i.name):r.item}</td><td style="text-align:right;font-weight:700;color:var(--arc-yellow);">x${r.count}</td></tr>`; }).join('')+`</tbody></table>`; } cHtml+=`</div>`;
        }
        if(d.levels){
            uHtml+=`<div class="info-section"><div class="info-title">${getUI('upgrades')}</div>`;
            d.levels.sort((a,b)=>a.level-b.level).forEach(l=>{ const lr=normalizeReqs(l.requirements); uHtml+=`<details class="upgrade-level"><summary><span>${getUI('level')} ${l.level}</span><button class="btn-track" onclick="event.preventDefault();addReqsToWishlist('${encodeURIComponent(JSON.stringify(lr))}',this)"><svg style="width:14px;height:14px;fill:currentColor;margin-right:5px;"><use href="#icon-plus"></use></svg> ${getUI('track')}</button></summary><div style="padding:10px;">`+lr.map(r=>{ const i=getItem(r.item); return `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:4px 0;"><div style="display:flex;align-items:center;font-size:0.9rem;color:#ccc;">${i?`<img src="${getImg(i)}" class="mini-icon" onerror="this.style.display='none'">`:''}${i?getLoc(i.name):r.item}</div><div style="color:var(--arc-yellow);font-weight:700;">x${r.count}</div></div>`; }).join('')+`</div></details>`; }); uHtml+=`</div>`;
        }
        if(!d.levels){
            let us=[]; itemsDB.forEach(i=>{ if(i.recipe&&normalizeReqs(i.recipe).find(r=>r.item===d.id)) us.push({p:i,t:'CRAFT'}); }); hideoutDB.forEach(h=>{ if(h.levels) h.levels.forEach(l=>{ if(normalizeReqs(l.requirements).find(r=>r.item===d.id)) us.push({p:h,t:`HIDEOUT LVL ${l.level}`}); }); });
            if(us.length>0){ usHtml+=`<div class="info-section"><div class="info-title">${getUI('used_for')}</div>`; us.forEach(u=>{ const im=getImg(u.p)||(currentSection==='OFFICINA'?`${GITHUB_RAW_BASE_URL}images/menu/${u.p.id.toLowerCase()}.png`:''); usHtml+=`<div style="padding:5px 0;border-bottom:1px solid #222;display:flex;align-items:center;cursor:pointer;" onclick="closeInfoModal();setTimeout(()=>openInfoModal(getItem('${u.p.id}')),100)">${im?`<img src="${im}" class="mini-icon" onerror="this.style.display='none'">`:''} ${getLoc(u.p.name)} <span style="font-size:0.7rem;color:#666;margin-left:10px;">${u.t}</span></div>`; }); usHtml+=`</div>`; }
        }
        dom.infoModal.innerHTML=`<div class="overlay-header"><div class="overlay-title">${getLoc(d.name)}</div><button class="overlay-close" onclick="closeInfoModal()">×</button></div><div class="overlay-scrollable-content">${cHtml||uHtml||usHtml?cHtml+uHtml+usHtml:'<div style="text-align:center;color:#666;margin-top:20px;">NESSUN DATO TECNICO DISPONIBILE</div>'}</div>`;
        dom.modalBackdrop.style.display='block'; dom.infoModal.style.display='flex';
    }

    const SIDEBAR_CONFIG={'INVENTARIO':[{id:'ALL',img:'all',labelKey:'ALL'},{id:'POTENZIAMENTI',img:'augments',labelKey:'POTENZIAMENTI'},{id:'SCUDI',img:'shields',labelKey:'SCUDI'},{id:'ARMI',img:'weapons',labelKey:'ARMI'},{id:'MUNIZIONI',img:'ammunitions',labelKey:'MUNIZIONI'},{id:'MOD',img:'weapon_mods',labelKey:'MOD'},{id:'USO_RAPIDO',img:'quick_use',labelKey:'USO_RAPIDO'},{id:'CHIAVI',img:'keys',labelKey:'CHIAVI'},{id:'MATERIALI',img:'crafting_materials',labelKey:'MATERIALI'},{id:'VARIE',img:'misc',labelKey:'VARIE'},{id:'COSMETICS',icon:'icon-cosmetic',type:'svg',labelKey:'COSMETICS'}],'PROGETTI':[{id:'ALL',icon:'icon-all',type:'svg',labelKey:'ALL'},{id:'ARMI',img:'weapons',labelKey:'ARMI'},{id:'MOD',img:'weapon_mods',labelKey:'MOD'},{id:'USO_RAPIDO',img:'quick_use',labelKey:'USO_RAPIDO'},{id:'MATERIALI',img:'crafting_materials',labelKey:'MATERIALI'}],'OFFICINA':[{id:'ALL',img:'all',labelKey:'ALL'},{targetId:'scrappy'},{targetId:'workbench'},{targetId:'gunsmith'},{targetId:'gear_bench'},{targetId:'explosives_station'},{targetId:'refiner'},{targetId:'medical_lab'},{targetId:'utility_station'}],'MERCANTI':[],'NEGOZIO':[],'MISSIONI':[],'MAPPA':[]};

    (function(){ function reset(){ try{ itemsDB=[]; hideoutDB=[]; overridesDB={}; wishlist.clear(); ownedBlueprints.clear(); localStorage.removeItem('arc_wishlist'); localStorage.removeItem('arc_blueprints'); document.body.classList.remove('db-loaded'); dom.search.disabled=true; }catch(_){} currentSection='INVENTARIO'; setFilter('ALL'); render(); document.body.classList.remove('db-loaded'); } try{ document.querySelector('.app-logo').addEventListener('click', reset); }catch(_){} })();
