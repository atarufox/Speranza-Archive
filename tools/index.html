<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC RAIDERS // DATABASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-head: 'Teko', sans-serif;
            --font-ui: 'Rajdhani', sans-serif;
            --font-body: 'Barlow', sans-serif;
            --arc-yellow: #ffc400;
            --arc-teal: #00e5ff;
            --arc-red: #ff2a2a;
            --bg-dark: #050505;
            --bg-panel: #141619;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 30%, #1a1f2e 0%, #000000 80%);
            color: #e6e6e6;
            font-family: var(--font-ui);
            overflow: hidden;
            user-select: none;
            margin: 0;
        }

        /* UTILITIES */
        .font-teko { font-family: var(--font-head); }
        .font-raj { font-family: var(--font-ui); }
        .text-arc-yellow { color: var(--arc-yellow); }
        .text-arc-teal { color: var(--arc-teal); }
        .border-arc-yellow { border-color: var(--arc-yellow); }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: var(--arc-yellow); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* CRT EFFECT */
        #crt-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.15;
            transition: opacity 0.3s ease;
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 9999;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        /* ANIMATIONS */
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ITEM CARDS */
        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-card:hover {
            transform: scale(1.05);
            border-color: #fff;
            box-shadow: 0 0 25px rgba(255,255,255,0.1);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="crt-layer"></div>
    <div class="scanline"></div>

    <!-- 1. LANDING SCREEN -->
    <div id="landing-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
        <div class="mb-8 relative w-32 h-32 animate-pulse">
             <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_0_15px_rgba(255,196,0,0.5)]">
                <path d="M50 5 A45 45 0 0 1 95 50" stroke="#ffc400" stroke-width="2" fill="none" />
                <path d="M50 95 A45 45 0 0 1 5 50" stroke="#ffc400" stroke-width="2" fill="none" />
                <circle cx="50" cy="50" r="30" stroke="#00e5ff" stroke-width="1" fill="none" class="opacity-50" />
            </svg>
        </div>
        <h1 class="font-teko text-6xl tracking-[0.2em] text-white mb-2">ARC RAIDERS</h1>
        <div class="font-raj text-arc-yellow tracking-widest text-sm mb-12">TACTICAL DATABASE // V2.2</div>
        
        <button id="btn-connect" class="group relative px-12 py-3 bg-white/5 border border-white/20 hover:bg-white/10 hover:border-arc-yellow transition-all cursor-pointer">
            <div class="absolute inset-0 bg-arc-yellow/10 scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
            <span class="relative font-teko text-2xl tracking-widest text-white group-hover:text-arc-yellow transition-colors">ESTABLISH UPLINK</span>
        </button>
        <div id="loading-text" class="mt-4 font-mono text-xs text-gray-500 hidden">INITIALIZING SYSTEM...</div>
    </div>

    <!-- 2. MAIN APP -->
    <div id="app-container" class="hidden flex-col h-screen w-screen relative opacity-0">
        <!-- HEADER -->
        <header class="h-20 bg-black/90 border-b border-white/10 flex items-center justify-between px-6 z-40 shrink-0 backdrop-blur-md">
            <div class="flex items-center gap-8">
                <div class="flex flex-col leading-none select-none cursor-default">
                    <span class="font-teko text-3xl tracking-widest text-white">ARC DB</span>
                    <span class="text-[0.6rem] text-arc-teal font-bold tracking-[0.3em]">ONLINE</span>
                </div>
                <nav id="main-nav" class="flex gap-1"></nav>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative group">
                    <input type="text" id="search-input" placeholder="SEARCH DATABASE" 
                        class="bg-black/50 border border-white/20 rounded-sm px-4 py-1 w-64 font-raj uppercase text-sm focus:outline-none focus:border-arc-yellow focus:text-arc-yellow transition-colors placeholder-gray-600 text-white">
                </div>

                <button id="btn-wishlist" class="h-8 px-4 border border-white/20 rounded-sm font-raj font-bold text-sm uppercase flex items-center gap-2 hover:bg-white/10 transition-colors text-gray-300">
                    <span>WISHLIST</span>
                    <span id="wishlist-counter" class="bg-arc-yellow text-black text-xs px-1.5 rounded-sm font-mono hidden">0</span>
                </button>

                <button id="btn-crt-toggle" class="h-8 w-8 border border-white/20 rounded-sm flex items-center justify-center text-xs font-bold text-gray-500 hover:text-white hover:border-white transition-colors" title="Toggle CRT">CRT</button>
                
                <select id="lang-select" class="h-8 bg-black border border-white/20 text-gray-400 text-sm font-bold px-2 outline-none hover:border-white focus:border-white cursor-pointer">
                    <option value="it">ITA</option>
                    <option value="en">ENG</option>
                </select>
            </div>
        </header>

        <!-- CONTENT -->
        <div class="flex-1 flex overflow-hidden relative">
            <!-- SIDEBAR -->
            <aside id="sidebar" class="w-20 flex flex-col items-center gap-4 py-6 overflow-y-auto no-scrollbar z-30 bg-gradient-to-r from-black/90 to-transparent"></aside>

            <!-- MAIN VIEW -->
            <main id="main-view" class="flex-1 overflow-y-auto p-6 relative scroll-smooth">
                <!-- MAP -->
                <div id="map-container" class="hidden absolute inset-0 bg-black">
                     <div id="map-wrapper" class="relative w-full h-full overflow-hidden flex items-center justify-center">
                        <img src="https://raw.githubusercontent.com/atarufox/Speranza-Archive/main/images/maps/main.png" class="max-w-none h-full object-contain opacity-60">
                        <div id="map-markers" class="absolute inset-0 w-full h-full"></div>
                        
                        <!-- MAP HUD -->
                        <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-black/80 border border-white/20 px-6 py-1 rounded-full backdrop-blur">
                            <span id="map-clock" class="font-mono text-arc-teal tracking-widest text-lg">00:00:00 UTC</span>
                        </div>
                        <div id="map-events-panel" class="absolute top-20 left-8 w-80 flex flex-col gap-4 pointer-events-none"></div>
                     </div>
                </div>

                <!-- GRID -->
                <div id="grid-container" class="grid grid-cols-[repeat(auto-fill,minmax(110px,1fr))] gap-4 pb-20 content-start"></div>
                
                <!-- EMPTY STATE -->
                <div id="empty-state" class="hidden absolute inset-0 flex items-center justify-center flex-col text-gray-600 pointer-events-none">
                    <div class="font-teko text-5xl opacity-30">NO DATA</div>
                    <div class="font-raj text-sm tracking-widest">ARCHIVES ARE EMPTY</div>
                </div>
            </main>
        </div>
    </div>

    <!-- 3. MODAL -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modal-content" class="bg-[#0a0a0a] border border-arc-yellow w-full max-w-2xl max-h-[90vh] flex flex-col shadow-[0_0_50px_rgba(255,196,0,0.15)] relative animate-fade-in overflow-hidden"></div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
